plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketllm.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pocketllm.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 直接打包 jniLibs 下的 .so 与 assets 下的 .pllm，无需 externalNativeBuild
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}